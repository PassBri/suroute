# SuRoute para iPhone (SwiftUI). El proyecto de Xcode se genera con XcodeGen:  cd ios && xcodegen
name: SuRoute
options:
  bundleIdPrefix: com.rutaalacima
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.5.0"
configs:
  Debug: debug
  Release: release
targets:
  SuRoute:
    type: application
    platform: iOS
    sources:
      - path: SuRoute
        excludes: ["SuRoute.entitlements"]
      - path: Compartido
      # Los cuadernos de Aprende y Mochila: los mismos JSON de la app Android (una sola copia)
      - path: ../app/src/main/assets/content
        type: folder
        buildPhase: resources
      # Las 365 frases del día en 12 idiomas (las mismas de Android)
      - path: ../app/src/main/assets/frases
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/preguntas
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/SuRoute.xcconfig
      Release: Config/SuRoute.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LiveKit
        product: LiveKit
      - target: SuRouteWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rutaalacima.app
        CODE_SIGN_ENTITLEMENTS: SuRoute/SuRoute.entitlements
        PRODUCT_NAME: SuRoute
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SuRoute
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Para que te escuchen cuando enciendes una fogata en vivo."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Para abrir tu Ascenso financiero sin escribir el PIN."
        INFOPLIST_KEY_NSCameraUsageDescription: "Para tomar las fotos de tu Brújula y tus publicaciones, encender una fogata en vivo y escanear el código de SuRoute Web."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para elegir las fotos de tu Brújula y de tus publicaciones."
    info:
      path: SuRoute/Info.plist
      properties:
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        CFBundleLocalizations: [es, en, pt, fr, de, it, zh-Hans, ja, ko, ar, hi, ru]
        # El QR de SuRoute Web (rutacima://vincular?codigo=…) se abre con la cámara del iPhone
        # El audiolibro sigue sonando con la pantalla apagada
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.rutaalacima.app.vincular
            CFBundleURLSchemes: [rutacima]
  SuRouteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: ["Widget.entitlements"]
      - path: Compartido
      - path: SuRoute/Recursos/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rutaalacima.app.widget
        PRODUCT_NAME: SuRouteWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SuRoute
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  SuRoute:
    build:
      targets:
        SuRoute: all
    run:
      config: Debug
